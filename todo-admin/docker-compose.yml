services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: todo_admin
      DB_USER: todo_user
      DB_PASS: todo_pass
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: todo_admin
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: todo_user
      PMA_PASSWORD: todo_pass
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  db_data:
